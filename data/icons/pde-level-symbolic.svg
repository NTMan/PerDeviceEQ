<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16">
  <!-- a loudspeaker beside a rising ladder of levels: measure the
       playback level for this rig (CC0, drawn for this app). It is
       deliberately the twin of pde-find-gain-symbolic, same ladder in
       the same place with a loudspeaker where that one has a
       microphone, because the two rows do the same kind of work on
       the two ends of the chain: one walks the input's gain, this one
       walks the output's level.

       The cone opens TOWARD the ladder rather than away. A solid
       triangle pointing the other way reads as a rewind arrow at
       sixteen pixels, and every desktop volume glyph faces this way
       already.

       Note for anyone editing this file: an XML comment may not
       contain two hyphens in a row, so the house dash cannot be used
       here. This one was written with it and failed to parse. -->
  <path fill="#2e3436" d="M0.5 6 H2.5 V10 H0.5 Z"/>
  <path fill="#2e3436" d="M2.5 6 L6.5 2.5 V13.5 L2.5 10 Z"/>
  <path fill="#2e3436" d="M9 10 H11 V15 H9 Z"/>
  <path fill="#2e3436" d="M11.8 7 H13.8 V15 H11.8 Z"/>
  <path fill="#2e3436" d="M14.6 4 H16 V15 H14.6 Z"/>
</svg>
