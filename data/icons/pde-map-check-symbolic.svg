<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16">
  <!-- four rungs of a level map, one of them carrying something the
       others do not: read the map for the rung that does not belong
       with the rest (CC0, drawn for this app).

       The family's other two icons carry a ladder of rising bars
       because both of them WALK a control. This one reads what a walk
       left behind, so it carries a stack of level lines instead.

       Two drafts were rejected on evidence rather than taste, both at
       true sixteen pixels. A tall spike joined its line to the one
       above: three clear pixels is not enough height to rise into. A
       zigzag came out as a dashed line, which by convention means
       hidden rather than faulty. A short wide block sitting ON one
       line keeps a clear pixel above it and reads as something the
       other rungs do not have.

       It sits left of centre so the glyph is not symmetric, and the
       eye lands on the odd rung rather than on the middle.

       Every edge is on a whole pixel; the first draft used halves and
       rendered grey.

       Note for anyone editing this file: an XML comment may not
       contain two hyphens in a row, so the house dash cannot be used
       here. -->
  <path fill="#2e3436" d="M1 2 H15 V3 H1 Z"/>
  <path fill="#2e3436" d="M1 6 H15 V7 H1 Z"/>
  <path fill="#2e3436" d="M1 10 H15 V11 H1 Z"/>
  <path fill="#2e3436" d="M4 8 H8 V10 H4 Z"/>
  <path fill="#2e3436" d="M1 14 H15 V15 H1 Z"/>
</svg>
