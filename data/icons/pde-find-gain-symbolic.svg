<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16">
  <!-- a microphone beside a rising ladder of levels: find this
       input's working gain (CC0, drawn for this app, on the model of
       pde-level-symbolic). The capsule is what is being set; the
       steps are the ladder the search walks up.

       The capsule is drawn WIDE and the ladder in three bars because
       this is read at sixteen pixels: a first attempt cut steps into
       the capsule itself, which is the better idea and disappears
       entirely at that size. -->
  <path fill="#2e3436" d="M4 0.5 C2.9 0.5 2 1.4 2 2.5
    V5 C2 6.1 2.9 7 4 7 C5.1 7 6 6.1 6 5
    V2.5 C6 1.4 5.1 0.5 4 0.5 Z"/>
  <path fill="#2e3436" d="M0.5 4.5 V5 C0.5 6.76 1.8 8.22 3.5 8.46
    V11.5 H1.5 V13 H6.5 V11.5 H4.5 V8.46 C6.2 8.22 7.5 6.76 7.5 5
    V4.5 H6.5 V5 C6.5 6.38 5.38 7.5 4 7.5 C2.62 7.5 1.5 6.38 1.5 5
    V4.5 Z"/>
  <path fill="#2e3436" d="M9 10 H11 V15 H9 Z"/>
  <path fill="#2e3436" d="M11.8 7 H13.8 V15 H11.8 Z"/>
  <path fill="#2e3436" d="M14.6 4 H16 V15 H14.6 Z"/>
</svg>
